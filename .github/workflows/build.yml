name: Build DejaView

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-sidecar:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r dejaview/requirements.txt

      - name: Write client_secrets.json
        run: echo '${{ secrets.GOOGLE_CLIENT_SECRETS }}' > dejaview/resources/client_secrets.json
        shell: bash

      - name: Build sidecar with PyInstaller
        working-directory: dejaview
        run: pyinstaller sidecar/sidecar.spec --noconfirm

      - name: Validate sidecar binary
        shell: pwsh
        run: |
          $exe = "dejaview/dist/dejaview-sidecar.exe"
          if (!(Test-Path $exe)) {
            Write-Error "dejaview-sidecar.exe not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "dejaview-sidecar.exe size: $([math]::Round($size, 1)) MB"
          if ($size -lt 10 -or $size -gt 150) {
            Write-Error "Unexpected artifact size: $([math]::Round($size, 1)) MB"
            exit 1
          }
          # Verify PE header (MZ magic bytes)
          $bytes = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "Not a valid PE binary (missing MZ header)"
            exit 1
          }
          Write-Host "Valid Windows PE binary confirmed."

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: dejaview-sidecar-windows
          path: dejaview/dist/dejaview-sidecar.exe

  build-installer:
    runs-on: ubuntu-latest
    needs: build-sidecar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dejaview-sidecar-windows
          path: dejaview/src-tauri/binaries/

      - name: Rename sidecar for Tauri target triple
        run: |
          mv dejaview/src-tauri/binaries/dejaview-sidecar.exe \
             dejaview/src-tauri/binaries/dejaview-sidecar-x86_64-pc-windows-gnu.exe

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and build
        run: cd dejaview/frontend && npm ci && npm run build

      - name: Install Rust Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install mingw-w64 and NSIS
        run: sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nsis

      - name: Build Windows installer
        working-directory: dejaview
        run: frontend/node_modules/.bin/tauri build --target x86_64-pc-windows-gnu

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DejaView-Windows-Setup
          path: dejaview/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r dejaview/requirements.txt

      - name: Build Linux sidecar
        working-directory: dejaview
        run: |
          pyinstaller sidecar/sidecar.spec --noconfirm
          TARGET=src-tauri/binaries/dejaview-sidecar-x86_64-unknown-linux-gnu
          cp dist/dejaview-sidecar "$TARGET"
          chmod +x "$TARGET"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and build
        run: cd dejaview/frontend && npm ci && npm run build

      - name: Install WebKit and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing webkit2gtk-driver libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb

      - name: Install tauri-driver
        run: cargo install --git https://github.com/tauri-apps/tauri tauri-driver

      - name: Build Linux app binary (debug, no bundle)
        working-directory: dejaview
        run: frontend/node_modules/.bin/tauri build --debug --no-bundle

      - name: Copy sidecar to runtime location
        working-directory: dejaview
        run: |
          # With --no-bundle, Tauri does not copy sidecars to target/debug/.
          # tauri-plugin-shell resolves sidecars relative to the binary at runtime.
          SRC=src-tauri/binaries/dejaview-sidecar-x86_64-unknown-linux-gnu
          DST=src-tauri/target/debug/dejaview-sidecar-x86_64-unknown-linux-gnu
          cp "$SRC" "$DST"
          chmod +x "$DST"

      - name: Install E2E test dependencies
        run: cd dejaview/tests-e2e && npm ci

      - name: Diagnose E2E environment
        run: |
          echo "=== tauri-driver ==="
          which tauri-driver && tauri-driver --help 2>&1 || echo "tauri-driver not found"
          echo "=== WebKitWebDriver ==="
          which WebKitWebDriver || echo "WebKitWebDriver not found"
          echo "=== App binary ==="
          ls -la "$TAURI_APP_BINARY" || echo "App binary not found at $TAURI_APP_BINARY"
          echo "=== App shared library deps ==="
          ldd "$TAURI_APP_BINARY" 2>&1 | grep -E "not found|=>.*missing" || echo "All shared libs resolved"
        env:
          TAURI_APP_BINARY: ${{ github.workspace }}/dejaview/src-tauri/target/debug/app

      - name: Run E2E tests
        run: cd dejaview/tests-e2e && xvfb-run --auto-servernum npm test
        env:
          TAURI_APP_BINARY: ${{ github.workspace }}/dejaview/src-tauri/target/debug/app

  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r dejaview/requirements.txt
          pip install pytest pytest-cov hypothesis

      - name: Run Python tests
        working-directory: dejaview
        run: python -m pytest tests/unit tests/integration --tb=short --override-ini="addopts=--cov=. --cov-config=.coveragerc --cov-report=term-missing"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend tests
        working-directory: dejaview/frontend
        run: npm ci && npm test

  run-tests-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r dejaview/requirements.txt
          pip install pytest pytest-cov hypothesis

      - name: Run Python tests
        working-directory: dejaview
        run: python -m pytest tests/unit tests/integration --tb=short --override-ini="addopts="

  nightly-stress:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r dejaview/requirements.txt
          pip install pytest pytest-cov

      - name: Run stress tests
        working-directory: dejaview
        timeout-minutes: 30
        run: python -m pytest tests/stress -v --tb=short --override-ini="addopts="

  windows-smoke:
    runs-on: windows-latest
    needs: build-sidecar

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r dejaview/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: dejaview-sidecar-windows
          path: dejaview/dist/

      - name: Smoke test — sidecar launches and responds
        shell: pwsh
        working-directory: dejaview
        run: |
          $req = '{"jsonrpc":"2.0","id":1,"method":"get_app_version","params":{}}'
          $result = $req | python sidecar/sidecar_main.py 2>$null
          $json = $result | ConvertFrom-Json
          if (-not $json.result) {
            Write-Error "Sidecar did not return a version"
            exit 1
          }
          Write-Host "Sidecar version: $($json.result)"

      - name: Smoke test — scan one folder
        shell: pwsh
        working-directory: dejaview
        run: |
          # Create a test folder with a few images
          $testDir = "$env:TEMP\dejaview-smoke"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $pyDir = $testDir -replace '\\','/'
          python -c "from PIL import Image; img = Image.new('RGB', (64,64), (128,128,128)); img.save('$pyDir/test.jpg', 'JPEG')"

          # Send start_scan + get_scan_progress via JSON-RPC
          $commands = @(
            '{"jsonrpc":"2.0","id":1,"method":"start_scan","params":{"folders":["' + ($testDir -replace '\\','\\\\') + '"],"session_name":"smoke","enable_similarity":false}}'
          )
          $input = $commands -join "`n"
          # Sidecar exit code is unreliable: the daemon scanner thread may
          # still be using the DB when stdin closes and db.close() runs.
          # Capture stdout and verify the JSON-RPC response instead.
          $result = $input | python sidecar/sidecar_main.py 2>$null; $true
          Write-Host "Scan result: $result"
          if ($result -notmatch '"result":\s*\d+') {
            Write-Error "start_scan did not return a session ID"
            exit 1
          }
