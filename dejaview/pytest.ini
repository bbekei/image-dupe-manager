[pytest]
testpaths = tests
addopts = --cov=. --cov-config=.coveragerc --cov-report=term-missing -x
qt_api = pyqt6

markers =
    e2e: end-to-end tests that build and exercise the compiled binary (deselect with -m "not e2e")
    headless_e2e: headless end-to-end workflow tests — no GUI, no build required (deselect with -m "not headless_e2e")
