sonar.projectKey=dejaview
sonar.projectName=DejaView
sonar.sources=dejaview
sonar.tests=dejaview/tests
sonar.host.url=http://localhost:9000
# Token should be passed via command line: -Dsonar.token=YOUR_TOKEN
# sonar.token=

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript / JavaScript (frontend)
sonar.typescript.lcov.reportPath=dejaview/frontend/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/frontend/dist/**,**/*.spec,**/*.pyc
sonar.test.inclusions=dejaview/tests/**,dejaview/frontend/src/**/*.test.*
